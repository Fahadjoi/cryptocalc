# The site now builds into site/. Cloudflare Pages serves it; this file only matters if Netlify publishes again.
[build]
  publish = "site"

[[redirects]]
  from = "https://zesty-haupia-16a953.netlify.app/*"
  to = "https://coinabacus.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
