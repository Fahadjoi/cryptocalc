# Send the old Netlify address to the real domain
[[redirects]]
  from = "https://zesty-haupia-16a953.netlify.app/*"
  to = "https://coinabacus.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/_src/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
